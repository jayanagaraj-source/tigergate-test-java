# Deliberately insecure GitHub Actions workflow for CI/CD-security scanners
# (zizmor / semgrep / poutine class rules). `if: false` prevents it from ever
# running; the patterns are static and still detectable.
name: Insecure CI fixture
on:
  pull_request_target: # FINDING: IAC-210 CWE-284 gha-pull-request-target-with-checkout
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions: write-all # FINDING: IAC-211 CWE-269 gha-permissions-write-all

env:
  NPM_TOKEN: npm_F1xTuR3F4k3T0k3nAbCdEfGhIjKlMnOpQrStUv # FINDING: SEC-090 CWE-798 gha-secret-in-workflow-env

jobs:
  fixture:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main # FINDING: IAC-212 CWE-829 gha-unpinned-action-mutable-ref
        with:
          ref: ${{ github.event.pull_request.head.sha }} # FINDING: IAC-213 CWE-284 gha-checkout-untrusted-pr-head
          persist-credentials: true # FINDING: IAC-214 CWE-522 gha-persist-credentials

      - uses: some-org/unverified-action@v1 # FINDING: IAC-215 CWE-829 gha-third-party-action-not-sha-pinned

      - name: Script injection via event context
        run: echo "Title is ${{ github.event.issue.title }}" # FINDING: IAC-216 CWE-78 gha-expression-injection-issue-title

      - name: Script injection via PR body
        run: echo "${{ github.event.pull_request.body }}" > body.txt # FINDING: IAC-217 CWE-78 gha-expression-injection-pr-body

      - name: Pipe remote script into shell
        run: curl -fsSL https://get.example.com/install.sh | bash # FINDING: IAC-218 CWE-494 gha-curl-pipe-bash

      - name: Print secrets
        run: echo "${{ secrets.DEPLOY_KEY }}" # FINDING: IAC-219 CWE-532 gha-secret-echoed-to-log

      - name: Self-hosted runner on public repo pattern
        run: sudo apt-get install -y unattended-upgrades # FINDING: IAC-220 CWE-250 gha-sudo-in-step
